name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21', '25']
        include:
          - os: macos-latest
            java: '21'
          - os: windows-latest
            java: '21'

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Inspect the build JVM with the tool it just built
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          java -jar "$jar" --only overview,vm,gc

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.java }}
          path: build/reports/tests/test
