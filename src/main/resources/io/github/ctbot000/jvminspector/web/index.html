<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jvm-inspector</title>
<style>
:root {
  --bg: #fbfbfc; --panel: #ffffff; --ink: #14161a; --muted: #5d6470; --line: #e2e5ea;
  --accent: #2f6df6; --accent-soft: #e8f0ff; --warn: #a8600a; --warn-soft: #fdf3e2;
  --error: #b3261e; --error-soft: #fdecea; --ok: #1d7a4c;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #161a20; --ink: #e6e9ee; --muted: #9aa3b0; --line: #252b34;
    --accent: #6f9bff; --accent-soft: #1b2436; --warn: #e0a458; --warn-soft: #2a2114;
    --error: #ff8f85; --error-soft: #2c1a18; --ok: #62d09a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #161a20; --ink: #e6e9ee; --muted: #9aa3b0; --line: #252b34;
  --accent: #6f9bff; --accent-soft: #1b2436; --warn: #e0a458; --warn-soft: #2a2114;
  --error: #ff8f85; --error-soft: #2c1a18; --ok: #62d09a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }

header {
  display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.brand { font-weight: 650; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-weight: 400; }
#target { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
.spacer { flex: 1 1 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls label { color: var(--muted); font-size: 12.5px; display: flex; gap: 5px; align-items: center; }
select, input[type=number], input[type=search] {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px;
}
input[type=number] { width: 62px; }
button {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); color: #fff; }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 53px); }
nav {
  border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px;
  position: sticky; top: 53px; align-self: start; max-height: calc(100vh - 53px); overflow: auto;
}
nav h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  margin: 14px 8px 6px;
}
nav button {
  display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px;
  padding: 6px 9px; color: var(--ink);
}
nav button:hover { background: var(--accent-soft); color: var(--ink); }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button[disabled] { color: var(--muted); cursor: not-allowed; }
nav button small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }

main { padding: 18px 20px 60px; min-width: 0; }
h1 { font-size: 20px; margin: 0 0 4px; }
.desc { color: var(--muted); margin: 0 0 16px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
.tile .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }
.tile .v { font-size: 19px; font-weight: 600; font-family: var(--mono); margin-top: 3px; }
.tile .s { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.chart h3 { margin: 0 0 2px; font-size: 13px; }
.chart .now { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.chart svg { display: block; width: 100%; height: 66px; margin-top: 6px; overflow: visible; }

section.sub { margin: 20px 0 0; }
section.sub > h3 {
  font-size: 14px; margin: 0 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
section.sub section.sub { margin-left: 14px; padding-left: 10px; border-left: 2px solid var(--line); }

.props { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.props div { display: grid; grid-template-columns: minmax(180px, 320px) minmax(0, 1fr); gap: 12px; padding: 5px 12px; }
.props div:nth-child(even) { background: color-mix(in srgb, var(--line) 26%, transparent); }
.props dt, .props .k { color: var(--muted); }
.props .v { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.props .v.absent { color: var(--muted); font-style: italic; }

.tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; overflow: hidden; }
.tablewrap > header {
  position: static; display: flex; gap: 10px; align-items: center; padding: 8px 12px;
  border-bottom: 1px solid var(--line); background: none;
}
.tablewrap > header b { font-weight: 600; }
.tablewrap > header .count { color: var(--muted); font-size: 12px; }
.scroll { overflow: auto; max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th {
  position: sticky; top: 0; background: var(--panel); cursor: pointer; white-space: nowrap;
  color: var(--muted); font-weight: 600; z-index: 1;
}
th:hover { color: var(--accent); }
th[data-dir]::after { content: " \2191"; }
th[data-dir="desc"]::after { content: " \2193"; }
td { font-family: var(--mono); overflow-wrap: anywhere; }
td.num { text-align: right; }
tbody tr:hover { background: var(--accent-soft); }

.note { border-radius: 8px; padding: 8px 12px; margin: 10px 0; border: 1px solid var(--line); background: var(--panel); }
.note.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.note.error { border-color: var(--error); background: var(--error-soft); color: var(--error); }

details.code { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; }
details.code > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; font-size: 13px; }
details.code pre {
  margin: 0; padding: 0 12px 12px; overflow: auto; font-family: var(--mono); font-size: 12px;
  max-height: 60vh; white-space: pre;
}

#status { color: var(--muted); padding: 24px 2px; }
#status.error { color: var(--error); }
.pill { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <div class="brand">jvm-inspector <span id="version"></span></div>
  <div id="target">connecting&hellip;</div>
  <div class="spacer"></div>
  <div class="controls">
    <label>detail
      <select id="detail"><option value="standard">standard</option><option value="full">full</option></select>
    </label>
    <label>redact
      <select id="redact">
        <option value="secrets">secrets</option><option value="all">all</option><option value="none">none</option>
      </select>
    </label>
    <label>stacks <input type="number" id="stackDepth" min="0" max="256" value="12"></label>
    <label><input type="checkbox" id="expensive"> expensive</label>
    <button id="refresh" class="primary" title="Reload the current section (r)">Refresh</button>
    <select id="download">
      <option value="">Download&hellip;</option>
      <option value="text">as text</option>
      <option value="json">as JSON</option>
      <option value="markdown">as Markdown</option>
    </select>
    <button id="theme" title="Switch theme">&#9681;</button>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <h1 id="title">Live</h1>
    <p class="desc" id="description"></p>
    <div id="status"></div>
    <div id="live" hidden>
      <div class="tiles" id="tiles"></div>
      <div class="charts" id="charts"></div>
    </div>
    <div id="content" hidden>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <input type="search" id="filter" placeholder="Filter rows in this section  (press /)" style="flex:1">
      </label>
      <div id="body"></div>
    </div>
  </main>
</div>

<script>
"use strict";

const state = {
  view: "live",          // "live" | "report" | a section id
  sections: [],
  timer: null,
  history: [],           // live samples, newest last
  maxHistory: 150,
};

const $ = (id) => document.getElementById(id);

/* ---------- formatting ---------- */

function bytes(n) {
  if (n === null || n === undefined || n < 0) return "n/a";
  if (n < 1024) return n + " B";
  const units = ["KiB", "MiB", "GiB", "TiB", "PiB"];
  let value = n, unit = -1;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return value.toFixed(1) + " " + units[unit];
}

function duration(ms) {
  if (ms === null || ms === undefined || ms < 0) return "n/a";
  if (ms < 1000) return ms + " ms";
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return (d ? d + "d " : "") + (d || h ? h + "h " : "") + m + "m " + sec + "s";
}

function percent(f) { return f === null || f === undefined ? "n/a" : (f * 100).toFixed(1) + "%"; }
function count(n) { return n === null || n === undefined ? "n/a" : n.toLocaleString("en-US"); }

/* ---------- api ---------- */

function params(extra) {
  const query = new URLSearchParams({
    detail: $("detail").value,
    redact: $("redact").value,
    stackDepth: $("stackDepth").value,
    expensive: $("expensive").checked ? "true" : "false",
  });
  for (const [k, v] of Object.entries(extra || {})) query.set(k, v);
  return query.toString();
}

async function getJson(path) {
  const response = await fetch(path, { headers: { "Accept": "application/json" } });
  if (!response.ok) throw new Error(response.status + " " + response.statusText + " for " + path);
  return response.json();
}

/* ---------- navigation ---------- */

function buildNav() {
  const nav = $("nav");
  nav.textContent = "";
  const group = (label) => { const h = document.createElement("h2"); h.textContent = label; nav.append(h); };
  const item = (id, title, description, enabled) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.view = id;
    button.disabled = enabled === false;
    button.append(document.createTextNode(title));
    if (description) { const s = document.createElement("small"); s.textContent = description; button.append(s); }
    button.addEventListener("click", () => show(id));
    nav.append(button);
    return button;
  };
  group("Dashboard");
  item("live", "Live", "Sampled every 2 seconds", true);
  group("Sections");
  state.sections.forEach((s) =>
    item(s.id, s.title, s.available ? "" : "needs in-process access", true));
  group("Everything");
  item("report", "Full report", "All sections at once", true);
  markCurrent();
}

function markCurrent() {
  document.querySelectorAll("#nav button").forEach((button) =>
    button.setAttribute("aria-current", String(button.dataset.view === state.view)));
}

function show(view) {
  state.view = view;
  markCurrent();
  if (view === "live") return showLive();
  return showReport(view);
}

/* ---------- live dashboard ---------- */

const CHARTS = [
  { key: "heapUsed", title: "Heap used", format: bytes },
  { key: "nonHeapUsed", title: "Non-heap used", format: bytes },
  { key: "threads", title: "Live threads", format: count },
  { key: "classes", title: "Loaded classes", format: count },
  { key: "collections", title: "GC collections", format: count },
  { key: "pause", title: "Total GC pause", format: duration },
];

function showLive() {
  $("title").textContent = "Live";
  $("description").textContent = "Sampled from the target every two seconds. Counters keep their history for as long as this page stays open.";
  $("content").hidden = true;
  $("live").hidden = false;
  $("status").textContent = state.history.length ? "" : "waiting for the first sample…";
  renderLive();
}

function sampleOf(live) {
  return {
    at: live.timestamp,
    heapUsed: live.heap ? live.heap.used : null,
    heapMax: live.heap ? live.heap.max : null,
    nonHeapUsed: live.nonHeap ? live.nonHeap.used : null,
    threads: live.threads ? live.threads.live : null,
    classes: live.classes ? live.classes.loaded : null,
    collections: live.gc ? live.gc.collections : null,
    pause: live.gc ? live.gc.pauseMillis : null,
    raw: live,
  };
}

async function poll() {
  try {
    const live = await getJson("/api/live");
    state.history.push(sampleOf(live));
    if (state.history.length > state.maxHistory) state.history.shift();
    if (state.view === "live") { $("status").textContent = ""; renderLive(); }
  } catch (failure) {
    if (state.view === "live") fail(failure);
  }
}

function tile(key, value, sub, ratio) {
  const node = document.createElement("div");
  node.className = "tile";
  const k = document.createElement("div"); k.className = "k"; k.textContent = key;
  const v = document.createElement("div"); v.className = "v"; v.textContent = value;
  node.append(k, v);
  if (sub) { const s = document.createElement("div"); s.className = "s"; s.textContent = sub; node.append(s); }
  if (typeof ratio === "number" && isFinite(ratio)) {
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = Math.max(0, Math.min(100, ratio * 100)).toFixed(1) + "%";
    bar.append(fill); node.append(bar);
  }
  return node;
}

function renderLive() {
  const last = state.history[state.history.length - 1];
  if (!last) return;
  const live = last.raw;
  const tiles = $("tiles");
  tiles.textContent = "";
  if (live.heap) {
    tiles.append(tile("Heap used", bytes(live.heap.used),
      live.heap.max > 0 ? "of " + bytes(live.heap.max) : "of " + bytes(live.heap.committed) + " committed",
      live.heap.max > 0 ? live.heap.used / live.heap.max : live.heap.used / live.heap.committed));
  }
  if (live.nonHeap) tiles.append(tile("Non-heap used", bytes(live.nonHeap.used), "committed " + bytes(live.nonHeap.committed)));
  if (live.threads) tiles.append(tile("Threads", count(live.threads.live), live.threads.daemon + " daemon, peak " + live.threads.peak));
  if (live.classes) tiles.append(tile("Classes", count(live.classes.loaded), count(live.classes.total) + " loaded, " + count(live.classes.unloaded) + " unloaded"));
  if (live.gc) tiles.append(tile("GC collections", count(live.gc.collections), duration(live.gc.pauseMillis) + " paused"));
  if (live.cpu) {
    tiles.append(tile("Process CPU", percent(live.cpu.processLoad),
      live.cpu.processors + " processors, load " + (live.cpu.loadAverage === null ? "n/a" : live.cpu.loadAverage.toFixed(2)),
      live.cpu.processLoad));
  }
  if (live.uptimeMillis !== undefined) tiles.append(tile("Uptime", duration(live.uptimeMillis), new Date(live.startTime).toLocaleString()));
  if (live.compilationMillis !== undefined) tiles.append(tile("Time compiling", duration(live.compilationMillis)));

  const charts = $("charts");
  charts.textContent = "";
  CHARTS.forEach((spec) => {
    const values = state.history.map((s) => s[spec.key]).filter((v) => v !== null && v !== undefined);
    if (!values.length) return;
    charts.append(chart(spec, values));
  });

  if (live.pools && live.pools.length) charts.append(poolChart(live.pools));
}

function chart(spec, values) {
  const node = document.createElement("div");
  node.className = "chart";
  const h = document.createElement("h3"); h.textContent = spec.title;
  const now = document.createElement("div"); now.className = "now";
  const first = values[0], last = values[values.length - 1];
  const change = last - first;
  now.textContent = spec.format(last) + (values.length > 1
    ? "   (" + (change >= 0 ? "+" : "−") + spec.format(Math.abs(change)).replace("n/a", "0") + " since this page opened)"
    : "");
  node.append(h, now, sparkline(values));
  return node;
}

function sparkline(values) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const width = 300, height = 66;
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("preserveAspectRatio", "none");
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const step = values.length > 1 ? width / (values.length - 1) : width;
  const points = values.map((v, i) => [i * step, height - 4 - ((v - min) / span) * (height - 10)]);
  const line = points.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

  const area = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  area.setAttribute("points", "0," + height + " " + line + " " + points[points.length - 1][0].toFixed(1) + "," + height);
  area.setAttribute("fill", "var(--accent)");
  area.setAttribute("opacity", "0.12");

  const path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  path.setAttribute("points", line);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "var(--accent)");
  path.setAttribute("stroke-width", "1.6");
  path.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(area, path);
  return svg;
}

function poolChart(pools) {
  const node = document.createElement("div");
  node.className = "chart";
  const h = document.createElement("h3"); h.textContent = "Memory pools";
  node.append(h);
  pools.forEach((pool) => {
    const limit = pool.max > 0 ? pool.max : pool.committed;
    const row = document.createElement("div");
    row.className = "now";
    row.textContent = pool.name + "  " + bytes(pool.used) + " / " + bytes(limit);
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = (limit > 0 ? Math.min(100, (pool.used / limit) * 100) : 0).toFixed(1) + "%";
    bar.append(fill);
    node.append(row, bar);
  });
  return node;
}

/* ---------- report rendering ---------- */

async function showReport(view) {
  const meta = state.sections.find((s) => s.id === view);
  $("title").textContent = view === "report" ? "Full report" : (meta ? meta.title : view);
  $("description").textContent = view === "report"
    ? "Every section the tool collects, in one page."
    : (meta && meta.description !== "null" ? meta.description : "");
  $("live").hidden = true;
  $("content").hidden = true;
  $("status").className = "";
  $("status").textContent = "collecting…";
  try {
    const path = view === "report" ? "/api/report?" + params() : "/api/section?" + params({ id: view });
    const report = await getJson(path);
    const body = $("body");
    body.textContent = "";
    // A single section already has its name in the page heading, so it is not repeated below it.
    const single = view !== "report";
    report.sections
      .filter((section) => !single || section.title !== "Inspection Run")
      .forEach((section) => body.append(renderSection(section, 0, !single)));
    $("status").textContent = "";
    $("content").hidden = false;
    applyFilter();
  } catch (failure) {
    fail(failure);
  }
}

function renderSection(section, depth, withHeading = true) {
  const node = document.createElement("section");
  node.className = "sub";
  if (withHeading) {
    const heading = document.createElement("h3");
    heading.textContent = section.title;
    node.append(heading);
  }
  if (withHeading && section.description && section.description !== "null") {
    const description = document.createElement("p");
    description.className = "desc";
    description.textContent = section.description;
    node.append(description);
  }
  let properties = null;
  for (const child of section.children) {
    if (child.type === "property") {
      if (!properties) { properties = document.createElement("div"); properties.className = "props"; node.append(properties); }
      properties.append(propertyRow(child));
      continue;
    }
    properties = null;
    if (child.type === "section") node.append(renderSection(child, depth + 1));
    else if (child.type === "table") node.append(renderTable(child));
    else if (child.type === "note") node.append(renderNote(child));
    else if (child.type === "code") node.append(renderCode(child));
  }
  return node;
}

function propertyRow(property) {
  const row = document.createElement("div");
  const key = document.createElement("span"); key.className = "k"; key.textContent = property.name;
  const value = document.createElement("span");
  value.className = "v" + (property.kind === "absent" ? " absent" : "");
  value.textContent = property.display;
  row.append(key, value);
  return row;
}

function cellValue(cell) {
  return cell !== null && typeof cell === "object" && "value" in cell ? cell.value : cell;
}

function cellText(cell) {
  if (cell === null || cell === undefined) return "—";
  if (typeof cell === "object") {
    if ("display" in cell) return cell.display;
    if (Array.isArray(cell)) return cell.join(", ");
  }
  return String(cell);
}

function renderTable(table) {
  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const head = document.createElement("header");
  const title = document.createElement("b"); title.textContent = table.title;
  const rows = document.createElement("span");
  rows.className = "count";
  rows.textContent = table.rows.length + (table.rows.length === 1 ? " row" : " rows");
  head.append(title, rows);
  const scroll = document.createElement("div");
  scroll.className = "scroll";
  const element = document.createElement("table");
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  table.headers.forEach((header, index) => {
    const th = document.createElement("th");
    th.textContent = header;
    th.addEventListener("click", () => sortBy(element, index, th));
    headRow.append(th);
  });
  thead.append(headRow);
  const tbody = document.createElement("tbody");
  table.rows.forEach((row) => {
    const tr = document.createElement("tr");
    let text = "";
    row.forEach((cell) => {
      const td = document.createElement("td");
      const value = cellValue(cell);
      td.textContent = cellText(cell);
      if (typeof value === "number") td.classList.add("num");
      td.dataset.sort = value === null || value === undefined ? "" : String(value);
      text += td.textContent + " ";
      tr.append(td);
    });
    tr.dataset.text = text.toLowerCase();
    tbody.append(tr);
  });
  element.append(thead, tbody);
  scroll.append(element);
  wrap.append(head, scroll);
  return wrap;
}

function sortBy(table, index, th) {
  const direction = th.dataset.dir === "asc" ? "desc" : "asc";
  table.querySelectorAll("th").forEach((other) => delete other.dataset.dir);
  th.dataset.dir = direction;
  const tbody = table.querySelector("tbody");
  const rows = Array.from(tbody.rows);
  const sign = direction === "asc" ? 1 : -1;
  rows.sort((left, right) => {
    const a = left.cells[index].dataset.sort, b = right.cells[index].dataset.sort;
    const na = parseFloat(a), nb = parseFloat(b);
    const numeric = !isNaN(na) && !isNaN(nb) && String(na) === a.trim() && String(nb) === b.trim();
    return sign * (numeric ? na - nb : a.localeCompare(b));
  });
  rows.forEach((row) => tbody.append(row));
}

function renderNote(note) {
  const node = document.createElement("div");
  node.className = "note" + (note.level === "warn" ? " warn" : note.level === "error" ? " error" : "");
  node.textContent = note.text;
  return node;
}

function renderCode(code) {
  const node = document.createElement("details");
  node.className = "code";
  const summary = document.createElement("summary");
  summary.textContent = code.title;
  const pre = document.createElement("pre");
  pre.textContent = code.body;
  node.append(summary, pre);
  if (code.body.split("\n").length <= 25) node.open = true;
  return node;
}

/* ---------- filtering ---------- */

function applyFilter() {
  const needle = $("filter").value.trim().toLowerCase();
  document.querySelectorAll("#body .tablewrap").forEach((wrap) => {
    let shown = 0;
    wrap.querySelectorAll("tbody tr").forEach((row) => {
      const match = !needle || row.dataset.text.includes(needle);
      row.hidden = !match;
      if (match) shown++;
    });
    const total = wrap.querySelectorAll("tbody tr").length;
    wrap.querySelector(".count").textContent =
      needle ? shown + " of " + total + " rows" : total + (total === 1 ? " row" : " rows");
    wrap.hidden = needle !== "" && shown === 0;
  });
  document.querySelectorAll("#body .props").forEach((group) => {
    let shown = 0;
    group.querySelectorAll(":scope > div").forEach((row) => {
      const match = !needle || row.textContent.toLowerCase().includes(needle);
      row.hidden = !match;
      if (match) shown++;
    });
    group.hidden = needle !== "" && shown === 0;
  });
}

/* ---------- wiring ---------- */

function fail(failure) {
  $("status").className = "error";
  $("status").textContent = "Could not reach the inspector: " + failure.message;
  $("content").hidden = true;
}

function theme(next) {
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("jvm-inspector-theme", next); } catch (ignored) { /* private mode */ }
}

async function boot() {
  try {
    const stored = localStorage.getItem("jvm-inspector-theme");
    if (stored) document.documentElement.dataset.theme = stored;
  } catch (ignored) { /* private mode */ }

  $("theme").addEventListener("click", () =>
    theme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  $("refresh").addEventListener("click", () => show(state.view));
  $("filter").addEventListener("input", applyFilter);
  ["detail", "redact", "stackDepth", "expensive"].forEach((id) =>
    $(id).addEventListener("change", () => { if (state.view !== "live") show(state.view); }));
  $("download").addEventListener("change", (event) => {
    const format = event.target.value;
    if (!format) return;
    window.location.href = "/api/download?" + params({ format });
    event.target.value = "";
  });
  document.addEventListener("keydown", (event) => {
    if (event.target.matches("input, select, textarea")) return;
    if (event.key === "/") { event.preventDefault(); $("filter").focus(); }
    if (event.key === "r") show(state.view);
  });

  try {
    const target = await getJson("/api/target");
    $("version").textContent = target.version;
    $("target").textContent = target.description;
    $("detail").value = target.defaults.detail;
    $("redact").value = target.defaults.redact;
    $("stackDepth").value = target.defaults.stackDepth;
    $("expensive").checked = target.defaults.expensive;
    state.sections = await getJson("/api/sections");
    buildNav();
  } catch (failure) {
    fail(failure);
    return;
  }

  show("live");
  poll();
  state.timer = setInterval(poll, 2000);
  document.addEventListener("visibilitychange", () => {
    clearInterval(state.timer);
    state.timer = document.hidden ? null : setInterval(poll, 2000);
    if (!document.hidden) poll();
  });
}

boot();
</script>
</body>
</html>
